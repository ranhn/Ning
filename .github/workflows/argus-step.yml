name: argus-step

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex@127.0.0.1:5433/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build everything
        run: |
          go build ./...
          go build -trimpath -ldflags "-s -w" -o dist/argus ./cmd/artex
          ls -lh dist

      # ARGUS 侧新增包的单测（命令沙箱的黑白名单、范围映射等）
      - name: Test ARGUS packages
        run: go test ./internal/... -count=1

      # Windows 二进制：开发机无法本地编译（DLP 加密依赖），由 CI 交叉编译产出。
      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/argus-fusion-windows-amd64.exe ./cmd/artex
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argus-fusion-windows-amd64
          path: dist/argus-fusion-windows-amd64.exe
          if-no-files-found: warn

      # 与 baseline 完全相同的就绪判定：端口能连就算启动（不要求 API 200）
      - name: Startup (same readiness probe as baseline)
        run: |
          mkdir -p data
          ./dist/argus -addr 127.0.0.1:8787 -data "$PWD/data" > artex.log 2>&1 &
          PID=$!
          echo "pid=$PID"
          ready=false
          for i in $(seq 1 60); do
            if ! kill -0 $PID 2>/dev/null; then
              echo "PROCESS EXITED after ${i}s"
              break
            fi
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:8787/ 2>/dev/null; then
              echo "port ready after ${i}s"
              ready=true
              break
            fi
            sleep 1
          done
          echo "--- log after startup ---"
          cat artex.log
          if [ "$ready" != "true" ]; then
            echo "FAILED to become ready"
            kill $PID 2>/dev/null || true
            exit 1
          fi

      - name: Smoke checks (report every endpoint)
        run: |
          check() {
            name="$1"; url="$2"
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 10 "$url" || echo "000")
            echo "=== $name -> HTTP $code ==="
            head -c 300 /tmp/body 2>/dev/null || true
            echo
          }
          check health http://127.0.0.1:8787/api/health
          check stats  http://127.0.0.1:8787/api/stats
          check tasks  http://127.0.0.1:8787/api/tasks
          check root   http://127.0.0.1:8787/

      - name: Publish log to repo
        if: always()
        run: |
          mkdir -p ci-logs
          cp artex.log ci-logs/last-run.log 2>/dev/null || echo "no log" > ci-logs/last-run.log
          echo "--- meta ---" >> ci-logs/last-run.log
          echo "run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA" >> ci-logs/last-run.log
          git config user.name "argus-ci"
          git config user.email "ci@local"
          git add ci-logs || true
          git commit -m "ci: run log [skip ci]" || true
          git push || true
