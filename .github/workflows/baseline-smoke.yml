name: baseline-smoke

# 目的：证明「原版 ARTEX 0.4.0」在干净环境里能完整部署并对外服务。
# 这是改造前的基线 —— 基线不绿，任何改造都不该开始。

on:
  push:
    branches: [baseline]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ARTEX_PG_DSN: postgres://artex:artex@127.0.0.1:5433/artex?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build (pristine source, no ARGUS changes)
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/artex ./cmd/artex
          ls -lh dist

      - name: Start ARTEX
        run: |
          mkdir -p data
          ./dist/artex -addr 127.0.0.1:8787 -data "$PWD/data" > artex.log 2>&1 &
          echo $! > artex.pid
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://127.0.0.1:8787/ 2>/dev/null; then
              echo "port open after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- startup log ---"
          tail -n 20 artex.log

      - name: Smoke checks (report every endpoint, never stop early)
        run: |
          check() {
            name="$1"; url="$2"
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 10 "$url" || echo "000")
            echo "=== $name -> HTTP $code ==="
            head -c 400 /tmp/body 2>/dev/null || true
            echo
          }
          check health  http://127.0.0.1:8787/api/health
          check stats   http://127.0.0.1:8787/api/stats
          check tasks   http://127.0.0.1:8787/api/tasks
          check root    http://127.0.0.1:8787/
          echo "--- full startup log ---"
          tail -n 60 artex.log

      - name: Verify API really works (exit non-zero if broken)
        run: |
          set -e
          # 只要有一个 API 返回 2xx/4xx（说明路由存在且服务在响应）就算部署成功；
          # 5xx 或连接失败才算失败。
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8787/api/tasks || echo 000)
          echo "api/tasks = $code"
          case "$code" in
            2*|3*|4*) echo "backend responding: OK" ;;
            *) echo "backend not responding: FAIL"; tail -n 80 artex.log; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artex-baseline-linux-amd64
          path: dist/artex
          if-no-files-found: warn
