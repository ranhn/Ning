# ARGUS 出口网关（squid）
#
# 部署方式见 deploy/egress/README.md：
#   1) argus egress -scope "domain_suffix:lab.internal,cidr:10.20.0.0/16" -o deploy/egress/argus-allow.conf
#   2) docker compose -f deploy/egress/docker-compose.egress.yml up -d
#
# 设计要点：squid 独占 argus-egress 这个 --internal 网络的唯一出口，
# 目标白名单由 ARGUS 从任务授权范围生成，与三层闸门同源。

http_port 3128

# 只监听内网，不对外提供服务
http_access deny to_localhost

# 白名单（由 argus egress 生成）
include /etc/squid/conf.d/*.conf

# 默认拒绝：没有匹配到白名单的请求一律 403
http_access deny all

# 禁止直连：所有请求必须按上面规则走，避免绕过白名单
never_direct allow all

# 关掉缓存与日志里的敏感内容（目标本身不敏感，但请求体可能含凭据）
cache deny all
via off
forwarded_for delete

access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
