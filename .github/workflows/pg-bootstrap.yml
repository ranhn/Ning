name: pg-bootstrap

# 目的：在干净的 Windows runner 上生成「已初始化」的 PostgreSQL 数据目录，
# 供开发机直接下载使用。
#
# 为什么需要：开发机的 DLP 让 initdb 无法完成（它 popen 子进程时标准输出句柄为 NULL，
# 实测 GetStdHandle 返回 0），这是环境限制而非代码问题。
# CI runner 没有 DLP，initdb 正常，产出的 data 目录同平台可直接启动。
#
# 产物发布到 release（公开仓库可直接下载，不需要 token）。

on:
  push:
    paths:
      - '.github/workflows/pg-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pgdata:
    runs-on: windows-latest
    steps:
      # 必须 checkout：release/git 操作都需要仓库上下文（之前缺这一步，导致发布必失败）
      - uses: actions/checkout@v4

      - name: Download PostgreSQL 16.4 binaries
        shell: pwsh
        run: |
          curl.exe -L --fail -o pg.zip https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64-binaries.zip
          Expand-Archive pg.zip -DestinationPath .
          if (-not (Test-Path pgsql\bin\initdb.exe)) { throw "initdb missing" }

      - name: initdb (trust auth, UTF8, C locale)
        shell: pwsh
        run: |
          .\pgsql\bin\initdb.exe -D data -U artex --auth=trust --encoding=UTF8 --locale=C
          if (-not (Test-Path data\PG_VERSION)) { throw "initdb did not produce PG_VERSION" }
          Get-Content data\PG_VERSION

      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path data -DestinationPath pgdata.zip -CompressionLevel Optimal
          Compress-Archive -Path pgsql\bin, pgsql\lib, pgsql\share -DestinationPath pgsql-core.zip -CompressionLevel Optimal
          Get-ChildItem *.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Publish to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = 'pgdata-16.4'
          gh release create $tag --title "PostgreSQL 16.4 portable (initialized)" --notes "Auto-generated by pg-bootstrap on a clean Windows runner. pgdata.zip = initialized data dir (user=artex, trust auth); pgsql-core.zip = bin/lib/share." 2>&1 | Out-String | Write-Output
          Write-Output "create_exit=$LASTEXITCODE"
          gh release upload $tag pgdata.zip --clobber 2>&1 | Out-String | Write-Output
          $u1 = $LASTEXITCODE
          gh release upload $tag pgsql-core.zip --clobber 2>&1 | Out-String | Write-Output
          $u2 = $LASTEXITCODE
          Write-Output "upload_pgdata=$u1 upload_core=$u2"
          if ($u1 -ne 0 -or $u2 -ne 0) { throw "release upload failed" }
