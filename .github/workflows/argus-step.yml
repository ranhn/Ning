name: argus-step

on:
  push:
    branches: [argus]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex@127.0.0.1:5433/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build everything
        run: |
          go build ./...
          go build -trimpath -ldflags "-s -w" -o dist/argus ./cmd/artex
          ls -lh dist

      - name: Startup smoke with process diagnostics
        run: |
          mkdir -p data
          ./dist/argus -addr 127.0.0.1:8787 -data "$PWD/data" > artex.log 2>&1 &
          PID=$!
          echo "pid=$PID"
          alive=true
          for i in $(seq 1 60); do
            if ! kill -0 $PID 2>/dev/null; then
              echo "PROCESS EXITED before becoming ready (after ${i}s)"
              alive=false
              break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8787/api/tasks 2>/dev/null || echo 000)
            if [ "$code" != "000" ]; then echo "ready after ${i}s (api/tasks=$code)"; break; fi
            sleep 1
          done
          echo "alive=$alive"
          wait $PID 2>/dev/null
          echo "exit_code=$?"
          echo "--- full log ---"
          cat artex.log
          [ "$alive" = "true" ] || exit 1

      - name: Publish diagnostic log to repo
        if: always()
        run: |
          mkdir -p ci-logs
          cp artex.log ci-logs/last-run.log 2>/dev/null || echo "no log" > ci-logs/last-run.log
          echo "--- meta ---" >> ci-logs/last-run.log
          echo "run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA" >> ci-logs/last-run.log
          git config user.name "argus-ci"
          git config user.email "ci@local"
          git add ci-logs || true
          git commit -m "ci: run log [skip ci]" || true
          git push || true
